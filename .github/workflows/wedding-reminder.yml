name: Wedding reminder texts

on:
  schedule:
    # Thursday 5 Nov 2026, 23:00 UTC = 6:00 PM Eastern (EST), the day before the wedding.
    # GitHub can start scheduled runs a few minutes late.
    - cron: "0 23 5 11 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list who would be texted (send nothing)"
        type: boolean
        default: true
      test_phone:
        description: "Send ONE sample reminder to this number only, e.g. +14045550123 (leave empty for the real run)"
        type: string
        default: ""

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Only in 2026
        id: gate
        run: |
          if [ "$(date -u +%Y)" = "2026" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22
      - name: Send reminder texts
        if: steps.gate.outputs.go == 'yes'
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ vars.SITE_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          TEST_PHONE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_phone || '' }}
        run: |
          npm install --no-audit --no-fund
          node send-reminders.mjs
